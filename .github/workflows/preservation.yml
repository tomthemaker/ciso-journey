name: V1 preservation
on:
  push:
    branches: [main]
    paths: &preservation-paths
      - index.html
      - src/**
      - public/**
      - assets/**
      - tests/**
      - scripts/**
      - .nvmrc
      - package.json
      - package-lock.json
      - '*.config.*'
      - 'tsconfig*.json'
      - .github/workflows/**
  pull_request:
    paths: *preservation-paths
permissions:
  contents: read
jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test -- --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preservation-failure-traces
          path: test-results/
          retention-days: 7
